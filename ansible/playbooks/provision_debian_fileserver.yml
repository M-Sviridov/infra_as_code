---
- name: Provision Debian File Server
  hosts: fileserver
  become: true
  vars:
    admin_username: "msviridov"
    admin_user_uid: 1000
    admin_group_name: "nas_admins"
    admin_group_gid: 10000
    nas_user_group_name: "nas_users"
    nas_user_group_gid: 10001
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILe+cHeVb5A5bkRiX467Q+o9Hmo8UkBFX3nAlvROhNuL msviridov@HOME_PROD_ed25519"

    deb_packages:
      - url: "https://github.com/45Drives/cockpit-identities/releases/download/v0.1.12/cockpit-identities_0.1.12-1focal_all.deb"
        dest: "/tmp/cockpit-identities.deb"
      - url: "https://github.com/45Drives/cockpit-file-sharing/releases/download/v4.3.1-2/cockpit-file-sharing_4.3.1-2bookworm_all.deb"
        dest: "/tmp/cockpit-file-sharing.deb"
      - url: "https://github.com/45Drives/cockpit-navigator/releases/download/v0.5.10/cockpit-navigator_0.5.10-1focal_all.deb"
        dest: "/tmp/cockpit-navigator.deb"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Cockpit without recommended packages
      apt:
        name: cockpit
        state: present
        install_recommends: false

    - name: Install required packages
      apt:
        name:
          - curl
          - sudo
          - vim
        state: present

    - name: Download .deb packages
      get_url:
        url: "{{ item.url }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop: "{{ deb_packages }}"
      register: downloaded_debs

    - name: Install downloaded .deb packages
      apt:
        deb: "{{ item.dest }}"
        state: present
      loop: "{{ deb_packages }}"
      when: downloaded_debs is succeeded

    - name: Clean up downloaded .deb files
      file:
        path: "{{ item.dest }}"
        state: absent
      loop: "{{ deb_packages }}"

    - name: Remove root from Cockpit disallowed-users
      lineinfile:
        path: /etc/cockpit/disallowed-users
        regexp: "^root"
        state: absent

    - name: Ensure Cockpit service is enabled and started
      systemd:
        name: cockpit.socket
        enabled: true
        state: started

    - name: Display Cockpit access information
      debug:
        msg: "Cockpit is now accessible at https://{{ ansible_host }}:9090"

    - name: Create custom group with GID 10000
      group:
        name: "{{ admin_group_name }}"
        gid: "{{ admin_group_gid }}"
        state: present

    - name: Create custom group with GID 10001
      group:
        name: "{{ nas_user_group_name }}"
        gid: "{{ nas_user_group_gid }}"
        state: present

    - name: Create new user with UID 1000
      user:
        name: "{{ admin_username }}"
        uid: "{{ admin_user_uid }}"
        groups:
          - "{{ admin_group_name }}"
          - sudo
        shell: /bin/bash
        create_home: true
        state: present

    - name: Set up passwordless sudo for the user
      lineinfile:
        path: /etc/sudoers.d/{{ admin_username }}
        line: "{{ admin_username }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Create .ssh directory for the user
      file:
        path: "/home/{{ admin_username }}/.ssh"
        state: directory
        owner: "{{ admin_username }}"
        group: "{{ admin_username }}"
        mode: "0700"

    - name: Add SSH public key to authorized_keys
      authorized_key:
        user: "{{ admin_username }}"
        key: "{{ ssh_public_key }}"
        state: present

    - name: Disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        state: present
      notify: restart sshd

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: restart sshd

    - name: Ensure PubkeyAuthentication is enabled
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PubkeyAuthentication"
        line: "PubkeyAuthentication yes"
        state: present
      notify: restart sshd

    - name: Run complex shell command for reinstall packages needing setcap
      ansible.builtin.shell: |
        cd /var/lib/dpkg/info/ && \
        apt install --reinstall $(grep -l 'setcap' * | sed -e 's/\.[^.]*$//g' | sort --unique)
      args:
        chdir: /var/lib/dpkg/info/
        executable: /bin/bash
      register: reinstall_output

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted
