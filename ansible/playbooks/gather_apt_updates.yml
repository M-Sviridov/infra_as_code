---
- name: Check for available updates on Debian based hosts
  hosts: all
  become: true
  gather_facts: true
  vars:
    apt_cache_valid_time: 3600
    show_package_details: false

  tasks:
    - name: Ensure the system is based on Debian
      fail:
        msg: "This playbook only supports Debian-based systems (Debian, Ubuntu, etc.)"
      when: ansible_os_family != "Debian"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: "{{ apt_cache_valid_time }}"
      register: apt_update_result

    - name: Get count of available updates
      shell: apt list --upgradable 2>/dev/null | grep -c "upgradable from" || echo "0"
      register: updates_count
      changed_when: false

    - name: Get list of available updates
      shell: apt list --upgradable 2>/dev/null | grep "upgradable from" | awk -F/ '{print $1}' | sort
      register: updates_available
      changed_when: false
      when: updates_count.stdout | int >= 1

    - name: Display available updates
      debug:
        msg:
          - "{{ inventory_hostname }}: {{ updates_count.stdout }} updates available"
          - "{{ updates_available.stdout_lines }}"
      when: updates_count.stdout | int >= 1

    - name: Display no updates message
      debug:
        msg: "{{ inventory_hostname }}: System is up to date"
      when: updates_count.stdout | int == 0
