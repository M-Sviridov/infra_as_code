---
- name: Provision Debian Server
  hosts: all
  become: true
  vars:
    new_username: "msviridov"
    new_user_uid: 1000
    new_group_name: "nas_admins"
    new_group_gid: 10000

    # Add new user to these group by default
    base_groups:
      - "{{ new_group_name }}"
      - sudo

    # Add new user to these group if Docker is installed on the host
    docker_groups:
      - docker

    # Change SSH key to the desired environment (DMZ, PROD, TEST, etc.)
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL8H29fWtGTGJTld7ZctjoquZFS/860umr8XzsVjjjwu msviridov@HOME_DMZ_ed25519"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - sudo
          - vim
        state: present

    - name: Create custom group with GID 10000
      group:
        name: "{{ new_group_name }}"
        gid: "{{ new_group_gid }}"
        state: present

    - name: Check if Docker is installed
      command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Check if docker group exists
      getent:
        database: group
        key: docker
      register: docker_group_check
      failed_when: false
      when: docker_check.rc == 0

    - name: Create new user with UID 1000
      user:
        name: "{{ new_username }}"
        uid: "{{ new_user_uid }}"
        groups: "{{ base_groups + (docker_groups if (docker_check.rc == 0 and docker_group_check.ansible_facts.getent_group.docker is defined) else []) }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Set up passwordless sudo for the user
      lineinfile:
        path: /etc/sudoers.d/{{ new_username }}
        line: "{{ new_username }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Create .ssh directory for the user
      file:
        path: "/home/{{ new_username }}/.ssh"
        state: directory
        owner: "{{ new_username }}"
        group: "{{ new_username }}"
        mode: "0700"

    - name: Add SSH public key to authorized_keys
      authorized_key:
        user: "{{ new_username }}"
        key: "{{ ssh_public_key }}"
        state: present

    - name: Disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        state: present
      notify: restart sshd

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: restart sshd

    - name: Ensure PubkeyAuthentication is enabled
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PubkeyAuthentication"
        line: "PubkeyAuthentication yes"
        state: present
      notify: restart sshd

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted
