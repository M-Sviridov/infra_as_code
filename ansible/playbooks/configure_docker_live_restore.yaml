---
- name: Configure Docker live-restore
  hosts: docker
  become: true

  tasks:
    - name: Ensure /etc/docker directory exists
      file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Check if daemon.json exists
      stat:
        path: /etc/docker/daemon.json
      register: daemon_json

    - name: Read existing daemon.json
      slurp:
        src: /etc/docker/daemon.json
      register: daemon_json_content
      when: daemon_json.stat.exists

    - name: Parse existing daemon.json or create empty dict
      set_fact:
        daemon_config: "{{ (daemon_json_content.content | b64decode | from_json) if daemon_json.stat.exists else {} }}"

    - name: Add live-restore to config
      set_fact:
        daemon_config: "{{ daemon_config | combine({'live-restore': true}) }}"

    - name: Write updated daemon.json
      copy:
        content: "{{ daemon_config | to_nice_json }}\n"
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Reload Docker daemon

  handlers:
    - name: Reload Docker daemon
      systemd:
        name: docker
        state: reloaded
