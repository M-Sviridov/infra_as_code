---
- name: Upgrade packages on Debian based hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: upgrade_result

    - name: Display upgrade results
      debug:
        msg:
          - "{{ inventory_hostname }}: Upgrade completed"
          - "{% if upgrade_result.changed %}System was updated{% else %}No updates were needed{% endif %}"

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display reboot notification
      debug:
        msg: "{{ inventory_hostname }}: ⚠️  REBOOT REQUIRED"
      when: reboot_required.stat.exists
